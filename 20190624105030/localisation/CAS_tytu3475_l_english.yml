CAS_enactlegalreforms:0 "Enact Legal Reforms"
CAS_enactlegalreforms_desc:0 ""
CAS_supportthedutchsolution:0 "Support the Dutch Solution"
CAS_supportthedutchsolution_desc:0 "Support the Annexation of New England into a Corporate Enclave"
CAS_indiandelegations:0 "Indian Delegations"
CAS_indiandelegations_desc:0 "Come up with a solution to the Indian problem once and for all."
CAS_bringthewolvestoextinction:0 "Bring the Wolves to Extinction"
CAS_bringthewolvestoextinction_desc:0 "Residents and loggers alike have long lived in fear of packs of feral wolves targeting them while out in the wilderness. Recruit an army of trappers until the wolves are no more."
CAS_appointjoelpalmer:0 "Appoint Joel Palmer"
CAS_appointjoelpalmer_desc:0 "Joel Palmer is appointed head of Indian affairs."
CAS_separatistscompromise:0 "Separatists Compromise."
CAS_separatistscompromise_desc:0 "A new territory is formed where slavery is legal. Anti-slavery laws across the country are weakened but not repealed."
CAS_reinstateblackexclusionlaws:0 "Reinstate Black Exclusion Laws"
CAS_reinstateblackexclusionlaws_desc:0 "Reinstate the laws baring Negros from settling across Cascadia."
CAS_armyofcascadia:0 "Army of Cascadia"
CAS_armyofcascadia_desc:0 "To secure a strong military the regional militias must be combined into a unified force."
CAS_appointrobertnewell:0 "Appoint Robert Newell"
CAS_appointrobertnewell_desc:0 "Robert Newell is appointed head of Indian Affairs"
CAS_hauxhurstplan:0 "Hauxhurst Plan"
CAS_hauxhurstplan_desc:0 "The Rights of the individual must be secured. As we know, the government which governs the least is the most successful and our model should be based on that."
CAS_thesecondchampoegmeetings:0 "The Second Champoeg Meetings"
CAS_thesecondchampoegmeetings_desc:0 "The leading Settlers of Oregon meet again for the second time in 30 years to talk about the  creation of a new provisional government, this time one free of the union."
CAS_gilpinplan:0 "Gilpin Plan"
CAS_gilpinplan_desc:0 "Base the new government off the old one and model it on the United States."
CAS_neworegontrail:0 "New Oregon Trail"
CAS_neworegontrail_desc:0 "Encourage the migration of new settlers across the region."
CAS_finalsolution:0 "Final Solution"
CAS_finalsolution_desc:0 "A mass ethnic cleansing of all natives is ordered across the country."
CAS_freemilitia:0 "Free Militia"
CAS_freemilitia_desc:0 "To ensure freedom across the land regional militias must operate independently."
CAS_oregoninstitute:0 "Oregon Institute"
CAS_oregoninstitute_desc:0 "Create the Oregon Institute"

l_english:
 BOOKMARK_1886_NAME:0 "1886 - The Scramble"
 BOOKMARK_1886_DESC:0 "The Berlin Conference has just ended and the partition of Africa is agreed on paper, though barely begun on the ground. Germany is fifteen years old and still twenty-six states with twenty-six crowns. The Qing rule from the Amur to Hainan. Russia's court sits in Sankt Petersburg and its empire runs from Warsaw to Vladivostok. Britain holds all of Ireland and most of India through princes who keep their own armies. And in North America, the Union is not alone."
 PRS_1886_DESC:0 "First among twenty-six. The Kaiser is King of Prussia, the army is Prussian, and the Empire is a federation Prussia built to be led by Prussia. But Bavaria, Saxony and Wurttemberg keep their own war ministries, and Bismarck has spent fifteen years making sure nobody has to test what that means."
 ENG_1886_DESC:0 "The workshop of the world, and beginning to feel the draught. Ireland is a British county and Gladstone's Home Rule bill will split the Liberal Party this year. India is held through princes. The Navy is unmatched; the Army is small and busy."
 FRA_1886_DESC:0 "Sixteen years a republic and still arguing about whether it should be. Alsace and Lorraine are German. General Boulanger becomes Minister of War this January, and within two years will be the most dangerous man in France."
 RUS_1886_DESC:0 "An empire from Warsaw to Vladivostok, ruled from Sankt Petersburg by a Tsar whose father was assassinated five years ago. Finland has its own diet and army, Poland has neither, and Central Asia is being swallowed khanate by khanate."
 AUS_1886_DESC:0 "Two states, one crown, and a standing argument about everything else. Vienna rules Bohemia and Galicia, Budapest rules Croatia and Transylvania, and Bosnia is occupied ground that belongs on paper to the Sultan."
 OTT_1886_DESC:0 "Still an empire from the Danube to the Yemen, and losing a piece of it every decade. Bulgaria has just swallowed Eastern Rumelia, Egypt is British-occupied, Tunisia is French, and the Powers call it the sick man of Europe to its face."
 QNG_1886_DESC:0 "The Middle Kingdom, ruled by a Manchu dynasty from Beijing, with Korea and Tibet as tributaries and Xinjiang newly made a province. The Self-Strengthening Movement builds arsenals and shipyards. Japan is watching."
 USA_1886_DESC:0 "A continental republic that no longer spans the continent. The Union's army is smaller than Belgium's, its industry is the largest on earth, and its southern border is a frontier rather than a memory."
 COF_1886_DESC:0 "Twenty-five years since secession and still here. Cotton pays for a real army, the ports are busy, and Richmond has learned that surviving a war and surviving the peace are different problems."
 ITA_1886_DESC:0 "Sixteen years since Rome, and the Pope still calls himself a prisoner in the Vatican. The north industrialises, the south does not, and the government has decided the answer is colonies on the Red Sea."
 JAP_1886_DESC:0 "Eighteen years since the Restoration. The samurai are gone, the constitution is being drafted, and an army built on the Prussian model is learning what it might be for. Korea is the question everyone is careful not to ask aloud."
 SPR_1886_DESC:0 "The King died in November and his son was born in May, so Spain is ruled by a regent for an infant. Cuba and the Philippines are Spanish, and both are expensive."
 OTHER_1886_DESC:0 "The rest of the world in 1886: princes, sultans, khans, chartered companies, Boer republics, and a Congo owned by a man rather than a country."

l_english:
 CDA_POWDERKEG_DESC:0 "Lacking support from a conquered union and facing a new wave of immigrants looking to escape the conflict gripping the rest of the country, the settlers of Oregon announced the creation of a new breakaway nation to handle their own affairs. These men and women who serve as the last true pioneers hope to gather the resources of their issolated upstart communities and use them to mold the pacific northwest into the forefront of history."
 DES_POWDERKEG_DESC:0 "Soon after the south announced their secession the Mormons of Utah also announced the formation of The Holy State of Desert. Now with the war over the fledgling theocracy retains its independence and looks forward to the future."
 CAL_POWDERKEG_DESC:0 "Now cut off from the rest of the United States and facing increased taxation, the western provisional government decided it was time to take affairs into their own hands. Announcing the formation of a second Republic of California and promising to bring about a type of prosparity that the old United States could never have acheived."
 COF_POWDERKEG_DESC:0 "Although, the Confederate States emerged victorious from the civil war, the foundation of its great empire was shaken to its core. The Assasination of Jefferson Davis just days after the Unions surrender has left the Confederacy in a state of Chaos. Inaffective governing and an unpopular president led to Texas leaving the confederacy and as political turmoil intensifies many fear the nation was better off before its secession."
 AZT_POWDERKEG_DESC:0 "Sensing the weakness of their old rivals and still bitter over the Mexician-American War. The mexician government begins funding guerilla fighters to take advantage of the diminished resources caused by the war and claim New Mexico and Arizona as part of a new Mexican Client State known at the Republic of Aztlan. This new nation made up of veterans of the Texas Rebelion and Mexician War have one goal. To defeat retake the territory stolen from them by the American settlers at any cost."

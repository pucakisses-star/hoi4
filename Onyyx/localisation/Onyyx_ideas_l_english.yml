l_english:
 John_Woolley:0 "John W. Woolley"
 John_Woolley_desc:0 "Serving as a solider, a peacekeeper and an ordained high priest. Woolley was not only a personal friend of the Prophet Joseph Smith but one who has spent the entirerty of his life in service of the church."
 david_toreen:0 "David Toreen"
 david_toreen:0 "A former Texas Ranger who was left for dead by his colleges after an indian attack. Toreen wandered the desert for weeks before coming across a group of Mormon missionaries who saved his life. Now a convert to the church, Toreen is offering to help repay the debt owed to us in anyway he can." 
 George_Cannon:0 "George Q. Cannon"
 George_Cannon_desc:0 "An early member of the Quorum of the Twelve Apostles, Cannon is considered a genius political strategist and a devout proponent of the mormon faith."
 Zions_Cooperative_Mercantile_Institution:0 "Zions Cooperative Mercantile Institution"





 ###CALIFORNIA###

 Emperor_Norton:0 "Emperor Norton" 
 Emperor_Norton_desc:0 "An excentric man who is the self-proclaimed Emperor of America and King of California. His wit and charm has endeared him to the people of San Fransico who he regurally preaches too whil wandering the streets and his very presense has been said to quell riots."
 Lealand_Stanford:0 "Lealand Stanford"
 Lealand_Stanford_desc:0 "This railway tycoon and philanthropist has always had an interest in politics and his connections to not only political figures but buisness leaders may prove useful."
 Henery_Wells:0 "Henry Wells"
 Henery_Wells_desc:0 "A sucessful entrepenuer and co-founder of Wells Fargo. He now is offering his services as an advisor to help guide our new nations economy."
 Mark_Twain:0 "Samuel Clemens"
 Mark_Twain_desc:0 "This popular writer and humorist has capitvated both common people and intellectuals alike with his best selling stories."
 Collis_Huntington:0 "Collis Huntington"
 Collis_Huntington_desc:0 "A member of the, "Big Four" Huntington is considered by many to one of the most powerful and hated men in the state. The railway tycon is hoping to make it big by uniting the fractured nations of this country together through an interconnected line of railroads."
 Romualdo_Pacheco:0 "Romualdo Pacheco"
 Romualdo_Pacheco_desc:0 "Former state treasuer and heir to a prominent mexician family, Pacheco seems to have high political ambitions and is well regarded by fellow politicians."  
 John_Sutter:0 "John Sutter"
 John_Sutter_desc:0 "A former pioneer who founded Sutter's Fort which eventually became the city of Sacramento."
 A_M_Winn:0 "A. M. Winn"
 A_M_Winn_desc:0 "One of the states founding fathers and founder of the mysterious Native Sons of the Golden West. This lifelong civic servant and military officer is a friend to the worker and California citizen alike." 
 Benjamin_Dewell:0 "Benjamin Dewell"
 Benjamin_Dewell_desc:0 "A rancher and first white settler in centeral California. Dewell was apart of the Bear Flag Revolt."
 John_Fremont:0 "John C. Fremont" 
 John_Fremont_desc:0 "Fremont and his expedition of American soldiers spurred the creation of the California Battalion, and his military advice led to the formation of the Bear Flag Republic. Fremont has been court-martialed for mutiny, gained and lost riches during the gold rush, served as California's Senator and nearly won the 1856 Presidental election. Now as California once again forms a Republic he is eager to offer his expertise and guide the nation to a new horizion."
 John_B_Weller:0 "John B. Weller"
 John_B_Weller_desc:0 "A former Govenor and devout abolitionist, Weller was an ineffective leader with strong convictions that will see about that justice is done."  
 Claus_Spreckels:0 "Claus Spreckels"
 Claus_Spreckelsr_desc:0 "A major industalist and proponent of white rule across the world. 


  
 ###CASCADIA###

Arthur_Denny:0 "Arthur A. Denny"
Arthur_Denny_desc:0 "Leader of the Denny Party and founder of Seattle. This pioneer is one of Cascadia's richest men and a leader among his people."
Chief_Kamiakin:0 "Chief Kamiakin"
Chief_Kamiakin_desc:0 "High Cheif of an alliance of 14 tribes and previously driven from his home after the Yakama War. Kamiakin has now returned to his ancestral homelands hoping to live out his days in peace."
David_Swinson_Maynard:0 "David Swinson Maynard"
David_Swinson_Maynard_desc:0 "A pioneer, doctor, and businessman, Maynard is one of the most prominent settlers in Cascadia and a leader of his community."
George_Edward_Cole:0 "George Edward Cole
George_Edward_Cole_desc:0 "The founding father of Spokane and a noted banker."
James_Glover:0 "A noted politican and railroad official."
James_Glover_desc:0 "The founding father of Spokane and a noted banker."
Joseph_Meek:0 "Joseph Meek"
Joseph_Meek_desc:0 "A pioneer, fur trapper and marshal, Meek played a prominent role in the Champoeg Meetings and helped establish the Provisional Government of Oregon."
Minister_Mystric:0 "Horidge Alvarasta"
Minister_Mystric_desc:0 "This strange fundamentalist was accused of practicing in the occult due to his mystic interpritations of the Book of Mormon. He soon traveled north with his followers and wives in search of a new home. After being driven from Idaho he found himself settling in eastern Cascadia."
Webley_John_Hauxhust:0 "Webley John Hauxhust"
Webley_John_Hauxhust_desc:0 "A noted pioneer who helped build the first grist mill in Oregon, participated in the Willamette Cattle Company, and was a participant at the Champoeg meeting."




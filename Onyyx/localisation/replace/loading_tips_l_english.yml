l_english:

 LOADING_TIP_0:0 "In every battle there comes a time when both sides consider themselves beaten, then he who continues the attack wins.\n- Ulysses S. Grant"
 
 LOADING_TIP_1:0 "War is cruelty. There is no use trying to reform it. The crueler it is, the sooner it will be over.\n- General Sherman"
 
 LOADING_TIP_2:0 "Few Americans born after the Civil War know much about war. Real war. War that seeks you out. War that arrives on your doorstep - not once in a blue moon, but once a month or a week or a day.\n- Nick Turse"
 
 LOADING_TIP_3:0 "I am quite certain that the crimes of this guilty land will never be purged away but with blood. I had, as I now think vainly, flattered myself that without very much bloodshed it might be done.\n- John Brown"

 LOADING_TIP_4:0 "A Union that can only be maintained by swords and bayonets, and in which strife and civil war are to take the place of brotherly love and kindness, has no charm for me.\n- Robert E. Lee"

 LOADING_TIP_5:0 "Two armies that fight one another is like one large army that commits suicide.\n- Henri Barbusse"

 LOADING_TIP_6:0 "The American Civil War produced carnage that has often been thought reserved for the combination of technological proficiency and inhumanity characteristic of a later time.  \n- Drew Gilpin Faust"

 LOADING_TIP_7:0 "War means fighting, and fighting means killing.\n- Nathan Bedford Forrest"

 LOADING_TIP_8:0 "This is the end and the beginning of an age. This is something far greater than the French Revolution or the Reformation and we live in it.\n- H.G.Wells."

 LOADING_TIP_9:0 "We are within measurable, or imaginable, distance of a real Armageddon. Happily there seems to be no reason why we should be anything more than spectators.\n- Henry Asquith"

 LOADING_TIP_10:0 "Independent thinking is not encouraged in a professional Army. It is a form of mutiny. Obedience is the supreme virtue.\n-David Lloyd George"

 LOADING_TIP_11:0 "The home front is always underrated by Generals in the field. And yet that is where the Great War was won and lost. The Russian, Bulgarian, Austrian and German home fronts fell to pieces before their armies collapsed.\n- David Lloyd George"

 LOADING_TIP_12:0 "Patriots always talk of dying for their country, and never of killing for their country.\n- Bertrand Russell"

 LOADING_TIP_13:0 "Nothing fills me with deeper sadness than to see a Southerner apologizing for the defense we made of our inheritance.\n- Jefferson Davis"

 LOADING_TIP_14:0 "The time for war has not yet come, but it will come, and that soon; and when it does come, my advice is to draw the sword and throw away the scabbard.\n- Stonewall Jackson"

 LOADING_TIP_15:0 "I would rather die a thousand deaths than surrender.\n- Robert E. Lee"

 LOADING_TIP_16:0 "The time for compromise has now passed, and the South is determined to maintain her position, and make all who oppose her smell Southern powder and feel Southern steel.\n- Jefferson Davis"

 LOADING_TIP_17:0 "Our Civil War was a blot on our history, but not as great a blot as the buying and selling of Negro souls.\n- Mark Twain"

 LOADING_TIP_18:0 "Yankee go home! \n- Southern Chant "

 LOADING_TIP_19:0 "War, at the best, is terrible, and this war of ours, in its magnitude and in its duration, is one of the most terrible.\n- Abraham Lincoln-"
 
 LOADING_TIP_20:0 "Patriots always talk of dying for their country, and never of killing for their country.\n- Bertrand Russell-"
 
 LOADING_TIP_21:0 "Civil wars leave nothing but tombs.\n- Alphonse De Lamartine"
 
 

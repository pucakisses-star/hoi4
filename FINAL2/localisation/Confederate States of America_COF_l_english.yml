l_english:
 cof.1.t:0 "Its Good to be in Dixie"
 cof.1.d:0 "The war is finally over and the people of the south now have a time to reflect on the conflict before they choose the path of their future."
 cof.1.a:0 "Yes, we need her."
 cof.1.b:0 "No, that won't be necessary."
 cof.2.t:0 "Manifest Destiny"
 cof.2.d:0 "The unique foundation and history of the United States makes it our duty to preserve democracy and freedom in the world. The last decade has proven that this mission cannot be fulfilled without taking up arms against those who seek to destroy it. From now on, every oppressor will have to answer to us, and our armed forces will liberate people across the globe."
 cof.2.a:0 "Liberty or death!"
 cof.3.t:0 "American Fleet in Pearl Harbor"
 cof.3.d:0 "The diplomatic and economic sanctions we have suffered from the United States appears to have been the beginning of something more threatening. The American Pacific Fleet has been stationed in the naval base in Pearl Harbor, Hawaii, clearly signaling that the Americans will maintain a strong presence in the Pacific and continue supporting our enemies. Striking against the base at this point may give us the element of surprise."
 cof.3.a:0 "Who knows how long the opportunity will last?"
 cof.4.t:0 "Destroyers for Bases Agreement"
 cof.4.d:0 "Having taken a stance against the Germans, the US appear interested in ensuring Britain stands strong against the German threat. They are, however, also concerned with maintaining their own naval presence in the Atlantic. In exchange for several of our naval bases, they will supply our nation with destroyer ships. The ships have been in reserve, but accepting will still strengthen the military bonds between our nations, and may be a wise decision."
 cof.4.a:0 "This is a unique opportunity."
 cof.4.a.tt:0 "We will gain 34 American Destroyers.\nCanada will gain 6 American Destroyers."
 cof.4.b:0 "This is clearly more favorable to the US, and unacceptable."
 cof.5.t:0 "Britain refuses offer"
 cof.5.d:0 "Despite our preparations and good intentions, Britain has refused our offer of old Destroyers in exchange for their naval bases."
 cof.5.a:0 "Their loss."
 cof.6.t:0 "Election of [GetYear]"
 cof.6.d:0 "The day of the presidential election has arrived. Incumbent Alexander H. Stephens who took office after the assasination of Jefferson Davis oversaw the reconstruction effort and negotitations between the Union over their surrender. Though popular with some moderates, many despise Davis, considering him to be a coward and ineffective leader. Many pressed war hero Robert E. Lee to run but despite his considerations he refused, leaving General John Brown Gordon as the major challangers against President Stephens."
 cof.6.a:0 "Stephens is good enough for the job."
 cof.6.b:0 "Gordon will lead this country to greatness."
 cof.7.t:0 "Roosevelt vs Willkie"
 cof.7.d:0 "Since the office of President of the United States was first established, no president has ruled for three consecutive terms. However, in light of the precarious state of the world and international developments in the last few years, President Roosevelt has decided to break with tradition and run for a third term. Republican Wendell Willkie, characterized as a dark horse candidate with a background as an industrialist with limited political experience, has been critical both of Roosevelt's economic interventionism and his justifications for running for a third term.\n\nAlthough the candidates have much in common in their foreign policies and Willkie wants to retain some form of the New Deal, many still consider this election a determining point for the future of American democracy."
 usa.7.a:0 "The Democrats. FDR is indispensable."
 usa.7.b:0 "The Republicans. We want Willkie!"

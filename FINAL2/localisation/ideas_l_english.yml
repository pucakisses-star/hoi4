 ###DESERET###`

 John_Woolley:0 "John W. Woolley"
 John_Woolley_desc:0 "Serving as a solider, a peacekeeper and an ordained high priest. Woolley was not only a personal friend of the Prophet Joseph Smith but one who has spent the entirerty of his life in service of the church."
 david_toreen:0 "David Toreen"
 david_toreen:0 "A former Texas Ranger who was left for dead by his colleges after an indian attack. Toreen wandered the desert for weeks before coming across a group of Mormon missionaries who saved his life. Now a convert to the church, Toreen is offering to help repay the debt owed to us in anyway he can." 
 George_Cannon:0 "George Q. Cannon"
 George_Cannon_desc:0 "An early member of the Quorum of the Twelve Apostles, Cannon is considered a genius political strategist and a devout proponent of the mormon faith."
 Zions_Cooperative_Mercantile_Institution:0 "Zions Cooperative Mercantile Institution"
 
 book_of_mormon:0 "Book of Mormon"
 book_of_mormon_desc:0 "Despite the death of their founder, the Mormons continue to live their lives based around his teachings as explained through their reveared holy book."
 mission:0 "Mission"
 mission_desc:0 "Since the 1830s, adherents to the Mormon faith have traveled the world to preach the word of the prophet Josepheh Smith. Since the Utah War, missionary work has been slow and revolved mostly around a select group of preists being sent to Europe." 
 
 

 ###CALIFORNIA###

 Emperor_Norton:0 "Emperor Norton" 
 Emperor_Norton_desc:0 "An excentric man who is the self-proclaimed Emperor of America and King of California. His wit and charm has endeared him to the people of San Fransico who he regurally preaches too whil wandering the streets and his very presense has been said to quell riots."
 Lealand_Stanford:0 "Lealand Stanford"
 Lealand_Stanford_desc:0 "This railway tycoon and philanthropist has always had an interest in politics and his connections to not only political figures but buisness leaders may prove useful."
 Henery_Wells:0 "Henry Wells"
 Henery_Wells_desc:0 "A sucessful entrepenuer and co-founder of Wells Fargo. He now is offering his services as an advisor to help guide our new nations economy."
 Mark_Twain:0 "Samuel Clemens"
 Mark_Twain_desc:0 "This popular writer and humorist has capitvated both common people and intellectuals alike with his best selling stories."
 Collis_Huntington:0 "Collis Huntington"
 Collis_Huntington_desc:0 "A member of the, "Big Four" Huntington is considered by many to one of the most powerful and hated men in the state. The railway tycon is hoping to make it big by uniting the fractured nations of this country together through an interconnected line of railroads."
 Romualdo_Pacheco:0 "Romualdo Pacheco"
 Romualdo_Pacheco_desc:0 "Former state treasuer and heir to a prominent mexician family, Pacheco seems to have high political ambitions and is well regarded by fellow politicians."  
 John_Sutter:0 "John Sutter"
 John_Sutter_desc:0 "A former pioneer who founded Sutter's Fort which eventually became the city of Sacramento."
 A_M_Winn:0 "A. M. Winn"
 A_M_Winn_desc:0 "One of the states founding fathers and founder of the mysterious Native Sons of the Golden West. This lifelong civic servant and military officer is a friend to the worker and California citizen alike." 
 Benjamin_Dewell:0 "Benjamin Dewell"
 Benjamin_Dewell_desc:0 "A rancher and first white settler in centeral California. Dewell was apart of the Bear Flag Revolt."
 John_Fremont:0 "John C. Fremont" 
 John_Fremont_desc:0 "Fremont and his expedition of American soldiers spurred the creation of the California Battalion, and his military advice led to the formation of the Bear Flag Republic. Fremont has been court-martialed for mutiny, gained and lost riches during the gold rush, served as California's Senator and nearly won the 1856 Presidental election. Now as California once again forms a Republic he is eager to offer his expertise and guide the nation to a new horizion."
 John_B_Weller:0 "John B. Weller"
 John_B_Weller_desc:0 "A former Govenor and devout abolitionist, Weller was an ineffective leader with strong convictions that will see about that justice is done."  
 Claus_Spreckels:0 "Claus Spreckels"
 Claus_Spreckelsr_desc:0 "A major industalist and proponent of white rule across the world. 

 bear_flag_republic:0 "Bear Flag Republic"
 bear_flag_republic_desc:0 "The Legacy of the original California Republic helps guide the political organization of this new country and gives its people a sense of national identity that other new countries have yet to find."
 industrialists_paradise:0 "Industrialists Paradise" 
 industrialists_paradise_desc:0 "With both the north and south facing a crisis of rebuilding their war torn infestructure, many industrialists are looking for a new place to build manufacturing empires."
 San_Fransico_Intelectulalism:0 "San Fransico Intelectulalism"
 San_Fransico_Intelectulalism_desc:0 "Since the end of the civil war San Fransico has begun to attract communities of thinkers and idealists who have formed their own cliches throughout the city."
  
 ###CASCADIA###

 Arthur_Denny:0 "Arthur A. Denny"
 Arthur_Denny_desc:0 "Leader of the Denny Party and founder of Seattle. This pioneer is one of Cascadia's richest men and a leader among his people."
 Chief_Kamiakin:0 "Chief Kamiakin"
 Chief_Kamiakin_desc:0 "High Cheif of an alliance of 14 tribes and previously driven from his home after the Yakama War. Kamiakin has now returned to his ancestral homelands hoping to live out his days in peace."
 David_Swinson_Maynard:0 "David Swinson Maynard"
 David_Swinson_Maynard_desc:0 "A pioneer, doctor, and businessman, Maynard is one of the most prominent settlers in Cascadia and a leader of his community."
 George_Edward_Cole:0 "George Edward Cole
 George_Edward_Cole_desc:0 "The founding father of Spokane and a noted banker."
 James_Glover:0 "A noted politican and railroad official."
 James_Glover_desc:0 "The founding father of Spokane and a noted banker."
 Joseph_Meek:0 "Joseph Meek"
 Joseph_Meek_desc:0 "A pioneer, fur trapper and marshal, Meek played a prominent role in the Champoeg Meetings and helped establish the Provisional Government of Oregon."
 Minister_Mystric:0 "Horidge Alvarasta"
 Minister_Mystric_desc:0 "This strange fundamentalist was accused of practicing in the occult due to his mystic interpritations of the Book of Mormon. He soon traveled north with his followers and wives in search of a new home. After being driven from Idaho he found himself settling in eastern Cascadia."
 Webley_John_Hauxhust:0 "Webley John Hauxhust"
 Webley_John_Hauxhust_desc:0 "A noted pioneer who helped build the first grist mill in Oregon, participated in the Willamette Cattle Company, and was a participant at the Champoeg meeting."

manafest_destiny:0 "Manafest Destiny"
manafest_destiny_desc:0 "The concept that America should expand to encompass the whole of the continent from sea to shining sea is one that drives these settlers to inhabit the final frontier of the nation."
oregon_trail:0 "Oregon Trail"
oregon_trail_desc:0 "With the rest of the country in termoil, the Oregon Trail is still a frequent route of settlers who are looking for a new land to call home." 
pioneer_spirit:0 "Pioneer Spirit"
pioneer_spirit_desc:0 ""

 ###CONFEDERACY###



slavery:0 "Slavery"
slavery_desc:0 "Despite the efforts of the global abolotionist movement, this country is one where the buying and selling of humans as property is legal." 

confederate_war_veterans:0 "Confederate War Veterans"
confederate_war_veterans_desc:0 "In the aftermath of the civil war hundreds of thousands of confederate veterans returned home from their occupation duties in the north to find their farms and homesteads in disrepair and any profit to be made from sharecropping dwarfed by the income from plantation owenrs."

southern_spirit:0 "Southern Spirit"
southern_spirit_desc:0 "The rebel spirit that envelops the whole of dixie is one that makes its people unique from those of the north. Use it to your advantage." 



 ###TEXAS###


 Indian_Raids:0 "Indian Raids"
 Indian_Raids_desc:0 "The Comanches continue to inhabit the western part of Texas and their hostility to white settlers ends often in violent attacks."
 Lone_Star_Republic:0 "Lone Star Republic"
 Lone_Star_Republic_desc:0 "The Texas Republic stands alone as a solitary nation."
 Slavery:0 "Slavery" 
 Slavery_desc:0 "Though some consider it to be a moral wrong, slavery is legal in your country and helps considerably in production. Yet other countries where the practice is outlawed will likely be more hostile to slave nations."


###USA###


 Northern_Reperations:0 "Northern Reperations"
 Northern_Reperations_desc:0 "As part of the surrender negotations between the North and South the North agreed to pay repreations to the Southern States."
 Divided_Country:0 "Divided Country"
 Divided_Country_desc:0 "In the aftermath of the civil war the union remains even more divided than it had before. Many radical abolionists who are bitter over Lincolns surrender adamently fight that the union does everything in its power to oppose slavey white some southern sympathizers not only consider the war to have been a lost cause but suggest legalizing slavey in the north to rebuild the country."
 Reconstruction:0 "Reconstruction"
 Reconstruction_desc:0 "Lees infamous march to the sea and the confederate scourched earth tactics during the later part of the war destroyed much of the country. The Conderate army laid waste to much of the north and what wasn't destoryed tbe enemy was destroyed by rioters. A great deal of effort will be needed to rebuild the country to its prewar status." 
 mexician_puppet:0 "Mexician Puppet" 
 mexician_puppet_desc:0 "Though offically the Republic of Aztlan is an indepedent nation made up concidently of mexician veterans and deserters, in practice it serves as an occupation force of the Mexician government with no political freedom outside the orders sent from Mexico City." 
 Declining_Empire:0 "Declining Empire"
 Declining_Empire_desc:0 "Given the unoffical title by other world powers as, "The Sick Man of Europe" The Ottoman Empire has been going through a period of massive decline which has left many of its rivals wondering for decades when it will finally die."
 Islam:0 "Islam"
 Osmans_Legacy:0 "Osmans Legacy"
 Osmans_Legacy_desc:0 "The Legacy of the Empires first Sultan continues to drive the foundation of the Empire today."
 turkish_bureaucracy:0 "Turkish Bureaucracy"
 turkish_bureaucracy_desc:0 "The Sultan and his Ministers mantain a mindnumbingly complex and massive system of bureaucracts to mantain power over the empire." 






 CAN_anglo_french_tensions_1:0 "Anglo-French Tensions"
 CAN_anglo_french_tensions_1_desc:0 "Most of Canada's French population is located in the eastern province of Québec, and the traditional distrust between the Québecois and English Canadians has heated up with recent talk of pushing the country towards war. Of all Canadians, the Québecois are the most ardently opposed to conscription and the idea of wasting their lives on a far-away war for a sovereign they feel isn't their own."


 
